[project]
name = "agent-workflows"
version = "0.1.0"
description = "PoC workflows: LangGraph-ready layout, Primo/Kogen data cleanup pipeline scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-trace-sdk",
    "langchain>=1.3.17",
]

[project.scripts]
primo-kogen-flow = "agent_workflows.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_workflows"]

[tool.uv.sources]
agent-trace-sdk = { path = "../sdk", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
